<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Joseph Toniolo — Senior Software Engineer portfolio" />
  <title>Joseph Toniolo — Senior Software Engineer</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- Fixed Navigation -->
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="#hero" class="nav__logo">JT</a>
      <button class="nav__hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav__links" id="navLinks">
        <li><a href="#about">About</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#highlights">Highlights</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>

    <!-- Hero -->
    <section id="hero" class="section hero">
      <div class="hero__content">
        <p class="hero__eyebrow" data-animate>Senior Software Engineer</p>
        <h1 class="hero__name" data-animate>Joseph Toniolo</h1>
        <p class="hero__tagline" data-animate id="heroTagline"></p>
        <div class="hero__cta" data-animate>
          <a href="#projects" class="btn btn--primary">View Work</a>
          <a href="#contact" class="btn btn--ghost">Contact Me</a>
        </div>
      </div>
      <div class="hero__scroll-hint" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="section about">
      <div class="container">
        <h2 class="section__title" data-animate>About</h2>
        <div class="about__grid">
          <div class="about__photo glass" data-animate>
            <img id="profileImg" src="/src/assets/profile.jpg" alt="Joseph Toniolo" />
            <div class="about__initials" id="profileInitials" aria-hidden="true">JT</div>
          </div>
          <div class="about__bio" data-animate id="aboutBio"></div>
        </div>
      </div>
    </section>

    <!-- Experience -->
    <section id="experience" class="section experience">
      <div class="container">
        <h2 class="section__title" data-animate>Experience</h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- Highlights -->
    <section id="highlights" class="section highlights">
      <div class="container">
        <h2 class="section__title" data-animate>Highlights</h2>
        <div class="highlights__grid" id="highlightsGrid"></div>
      </div>
    </section>

    <!-- Skills -->
    <section id="skills" class="section skills">
      <div class="container">
        <h2 class="section__title" data-animate>Skills</h2>
        <div class="skills__grid" id="skillsGrid"></div>
      </div>
    </section>

    <!-- Projects -->
    <section id="projects" class="section projects">
      <div class="container">
        <h2 class="section__title" data-animate>Projects</h2>
        <div class="projects__grid" id="projectsGrid"></div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section contact">
      <div class="container">
        <h2 class="section__title" data-animate>Get In Touch</h2>
        <div class="contact__card glass" data-animate id="contactCard"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p id="footerEdu"></p>
    <p>Built with Vite &middot; Deployed on Firebase &middot; &copy; <span id="year"></span> Joseph Toniolo</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
